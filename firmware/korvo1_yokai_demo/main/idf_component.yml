dependencies:
  lvgl/lvgl: "^9.2.0"
  espressif/esp_lvgl_adapter: "==0.7.0"
  espressif/esp_lv_lottie_player: "*"
  espressif/thorvg: "*"
  espressif/esp_new_jpeg: "*"
  espressif/esp32_s31_korvo_1_noglib:
    version: ==1.0.1
    rules:
      - if: "target == esp32s31"
  espressif/esp32_p4_function_ev_board_noglib:
    version: ==5.2.3
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: ==1.6.5
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: ==3.0.9
    rules:
      - if: "target == esp32p4"
  espressif/esp-sr:
    version: ==2.5.3
  espressif/esp_asrc:
    version: ==1.1.0
  espressif/esp_audio_effects:
    version: "==1.4.2"
  # Keep the S31 migration's transitive versions when resolving the new manifest.
  espressif/dl_fft:
    version: "==0.7.0"
    rules:
      - if: "target == esp32s31"
  espressif/libpng:
    version: "==1.6.58~1"
    rules:
      - if: "target == esp32s31"
  espressif/esp-dl: "==3.3.11"
  espressif/human_face_detect: "==0.4.2"
  espressif/human_face_recognition: "==0.3.2"
  idf: '>=6.0'
